name: 🕷️ Bug反馈
description: 报告问题或异常行为
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        清晰的描述你遇到的问题，有助于我们更快的解决问题。
  - type: checkboxes
    id: checklist
    attributes:
      label: '前置检查'
      description: '请确认您已完成以下操作'
      options:
        - label: '我已确认在 Issue 中没有人提过类似问题'
          required: true
        - label: '我已阅读说明文档没有查找到相关内容'
          required: true
        - label: '我理解如果未提供清晰的复现步骤或环境信息，该 Issue 可能会被关闭'
          required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 描述你遇到的问题
      placeholder: |
        简短清晰地描述你遇到的问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: |
        1. 第一步
        2. 第二步
        3. 第三步
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 'YesPlayMusic 版本'
      placeholder: |
        示例：v0.8.0-canary.1
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: '系统平台'
      description: '可多选；若问题在多个平台复现请都勾选'
      options:
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: |
        正常情况下发生什么？
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: |
        实际发生了什么？
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 添加截图、日志或其他补充信息。
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 其他想补充的信息。
    validations:
      required: false
  - type: checkboxes
    id: willing_to_contribute
    attributes:
      label: '是否愿意贡献'
      description: '如果你愿意提交 PR 修复此问题，请勾选'
      options:
        - label: '我愿意提交 PR'
    validations:
      required: false
