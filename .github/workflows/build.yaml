name: Tauri macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-arm64:
    name: Tauri Apple Silicon
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Build signed Tauri app
        run: bun run build:tauri

      - name: Package and verify DMG
        run: bun run package:tauri:dmg

      - name: Verify release checksum
        working-directory: dist_tauri
        run: shasum -a 256 -c *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-macos-aarch64
          path: dist_tauri/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YesPlayMusic-macos-aarch64
          path: release

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
