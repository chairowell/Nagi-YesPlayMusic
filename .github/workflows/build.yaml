name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Creating a release needs write access; the default GITHUB_TOKEN is
# read-only in organization repositories
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Only macOS is officially supported. The Windows and Linux packaging
    # config works (bun run build:win / build:linux run fine locally), but
    # nobody actually uses those platforms yet, so they stay commented out
    # to avoid noisy red builds. Uncomment them if you want to help — PRs
    # are welcome.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifacts: |
              dist_electron/*.dmg
          # - os: windows-latest
          #   platform: win
          #   artifacts: |
          #     dist_electron/*.exe
          # - os: ubuntu-22.04
          #   platform: linux
          #   artifacts: |
          #     dist_electron/*.AppImage
          #     dist_electron/*.deb
          #     dist_electron/*.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # .env is gitignored but required at build time: without it the
      # renderer's baseURL is undefined and the packaged app renders blank
      - name: Prepare .env
        run: cp .env.example .env
        shell: bash

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build:${{ matrix.platform }}
        env:
          # Unsigned build; users approve it once in System Settings
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          draft: true
          generate_release_notes: true
