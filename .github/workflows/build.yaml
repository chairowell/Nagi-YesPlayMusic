name: Desktop builds

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-arm64:
    name: Tauri Apple Silicon
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        # Tauri 构建不需要根项目里为 Electron 准备的 postinstall。
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Build locally signed Tauri app
        if: github.ref_type != 'tag' || vars.APPLE_SIGNING_ENABLED != 'true'
        run: bun run build:tauri

      - name: Package local DMG
        if: github.ref_type != 'tag' || vars.APPLE_SIGNING_ENABLED != 'true'
        run: bun run package:tauri:dmg

      - name: Verify Apple release secrets
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bun run verify:tauri:release-env

      - name: Import Developer ID certificate
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/yesplaymusic-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/yesplaymusic-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Developer ID signed and notarized DMG
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run build:tauri:release

      - name: Validate Developer ID signature and notarization ticket
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/YesPlayMusic.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Collect notarized release DMG
        if: github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: bun run collect:tauri:release-dmg

      - name: Verify release checksum
        working-directory: dist_tauri
        run: shasum -a 256 -c ./*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: YesPlayMusic-macos-aarch64
          path: dist_tauri/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && github.ref_type == 'tag' && vars.APPLE_SIGNING_ENABLED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/yesplaymusic-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/yesplaymusic-certificate.p12"

  build-tauri-windows-x64:
    name: Tauri Windows x64
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Prepare environment
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Cache Bun Windows target runtime
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bun-target-cache
          key: bun-target-${{ runner.os }}-1.3.12-windows-x64-baseline

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Build unsigned Tauri NSIS installer
        env:
          # 工作区在 D:，把交叉编译运行时也放到 D:，规避 Bun 1.3.12 跨盘 rename 故障。
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-target-cache
        run: bun run build:tauri:windows

      - name: Verify compiled Sidecar and UNM native addon
        shell: pwsh
        run: |
          & "src-tauri/binaries/yesplaymusic-sidecar-x86_64-pc-windows-msvc.exe" --unm-addon-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows Sidecar smoke test failed" }

      # PR 会执行构建验证，但不上传可传播的二进制；测试包只来自仓库自己的 ref。
      - name: Collect installer and create SHA-256 checksum
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist_tauri_windows | Out-Null
          Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe |
            Copy-Item -Destination dist_tauri_windows
          $hashes = Get-ChildItem dist_tauri_windows -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          if (-not $hashes) {
            throw 'Tauri Windows build did not produce an NSIS installer'
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist_tauri_windows/SHA256SUMS.txt'),
            (($hashes -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          @"
          YesPlayMusic Tauri Windows x64 experimental test build
          Commit: $env:GITHUB_SHA

          This package is unsigned. Windows SmartScreen may warn before installation.
          Do not disable antivirus or SmartScreen globally.
          "@ | Set-Content -Encoding utf8NoBOM dist_tauri_windows/TESTING-NOTICE.txt
          Get-Content dist_tauri_windows/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: YesPlayMusic-windows-x64-${{ github.sha }}
          path: dist_tauri_windows/*
          if-no-files-found: error
          retention-days: 7

  build-tauri-linux-x64:
    name: Tauri Ubuntu x64
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Verify release version
        run: bun run verify:tauri:version -- "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Build unsigned Tauri Linux packages
        run: |
          chmod +x scripts/ci/ldd
          PATH="$GITHUB_WORKSPACE/scripts/ci:$PATH" bun run build:tauri:linux

      - name: Verify compiled Sidecar and UNM native addon
        run: src-tauri/binaries/yesplaymusic-sidecar-x86_64-unknown-linux-gnu --unm-addon-smoke-test

      - name: Collect packages and create SHA-256 checksums
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist_tauri_linux
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist_tauri_linux/
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb dist_tauri_linux/
          cd dist_tauri_linux
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS.txt
          printf '%s\n' \
            'YesPlayMusic Tauri Ubuntu x64 experimental test build' \
            "Commit: $GITHUB_SHA" \
            '' \
            'AppImage can run without installation. The deb package targets Ubuntu/Debian systems.' \
            > TESTING-NOTICE.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: YesPlayMusic-linux-x64-${{ github.sha }}
          path: dist_tauri_linux/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: YesPlayMusic-macos-aarch64
          path: release

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
