name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # 官方只保证 macOS。Windows 和 Linux 的打包配置留在
    # electron-builder.yml 里（bun run build:win / build:linux 可用），
    # 但不进 CI —— 没人在那两个平台上实际使用，红灯只会变成噪音。
    # 欢迎有需要的人提 PR 把对应的 job 加回来。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifacts: |
              dist_electron/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # .env 不进版本库，但构建时必须有：
      # 缺了它前端 baseURL 会是 undefined，打出来的包页面全空
      - name: 准备 .env
        run: cp .env.example .env
        shell: bash

      - name: 安装依赖
        run: bun install

      - name: 打包
        run: bun run build:${{ matrix.platform }}
        env:
          # 没有 Apple 开发者证书，跳过签名。用户首次打开需要在
          # 「系统设置 → 隐私与安全性」里放行。
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: 打了 tag 就发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          draft: true
          generate_release_notes: true
