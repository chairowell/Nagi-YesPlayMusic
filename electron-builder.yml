# 从 vue.config.js 的 pluginOptions.electronBuilder 迁过来。
# 现在产物由 electron-vite 生成在 out/，不再走 vue-cli-service。
# appId 保持默认的 com.electron.yesplaymusic，和之前装的那版一致。
productName: YesPlayMusic
copyright: Copyright © YesPlayMusic
asar: true

directories:
  output: dist_electron
  buildResources: build

# 只打 electron-vite 的产物；node_modules 里的依赖 electron-builder
# 会按 package.json 的 dependencies 自动带上
files:
  - out/**
  - package.json

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${os}-${version}-${arch}.${ext}
  category: public.app-category.music
  darkModeSupport: true
  icon: build/icons/icon.icns

dmg:
  icon: build/icons/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icons/icon.ico

nsis:
  # 上游用的是 oneClick + deleteAppDataOnUninstall，卸载时会连歌曲缓存
  # 和登录状态一起删掉。这里改成常规安装向导，卸载也不动用户数据。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Audio
  icon: build/icons
