[package]
name = "yesplaymusic-tui"
version = "0.8.0-canary.2"
description = "ypm — YesPlayMusic in the terminal"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "ypm"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
dirs = "=6.0.0"
futures-util = "=0.3.33"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ncm-api-rs = "=0.1.0"
qrcode = { version = "=0.14.1", default-features = false }
ratatui = "=0.30.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls"] }
rodio = { version = "=0.22.2", features = ["symphonia-all"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
stream-download = { version = "=0.24.3", features = ["reqwest-rustls"] }
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-appender = "=0.2.3"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
unicode-width = "=0.2.2"
yesplaymusic-core = { path = "../core", features = ["cache"] }

[dev-dependencies]
tempfile = "=3.27.0"
